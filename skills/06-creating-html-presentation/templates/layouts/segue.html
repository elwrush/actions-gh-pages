<div class="slide-canvas">
    <div style="opacity: 0.6; letter-spacing: 5px; font-weight: 800;">{{ slide.phase }}</div>
    <h1 style="color: #FFD700; font-size: 3em; text-shadow: 2px 2px 15px rgba(0,0,0,1);">{{ slide.title | parse_directives | safe }}</h1>
    {% if slide.subtitle %}
    <h2 style="font-size: 1.5em; color: white; text-shadow: 2px 2px 10px rgba(0,0,0,1);">{{ slide.subtitle | parse_directives | safe }}</h2>
    {% endif %}
</div>
<aside class="notes">
    {{ slide.notes | default('Moving to next section.') }}
</aside>
