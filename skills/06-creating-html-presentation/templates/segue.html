<!-- SLIDE: SEGUE -->
<section data-transition="zoom" 
    {% if slide.video %} 
        data-background-video="{{ slide.video }}" data-background-video-muted
        data-background-opacity="{{ slide.get('data-background-opacity', 0.8) }}"
        {% if slide.get('video_loop', true) %}data-background-video-loop{% endif %}
    {% elif slide.image %}
        data-background="{{ slide.image }}"
        data-background-opacity="{{ slide.get('data-background-opacity', 1.0) }}"
    {% elif slide.background_gradient %}
        data-background-gradient="{{ slide.background_gradient }}"
    {% endif %}>
    
    <div class="slide-canvas">
        <div style="opacity: 0.6; letter-spacing: 5px; font-weight: 800;">{{ slide.phase }}</div>
        <h1 style="color: #FFD700; font-size: 3em; text-shadow: 2px 2px 15px rgba(0,0,0,1);">{{ slide.title }}</h1>
        {% if slide.subtitle %}
        <h2 style="font-size: 1.5em; color: white; text-shadow: 2px 2px 10px rgba(0,0,0,1);">{{ slide.subtitle }}</h2>
        {% endif %}
    </div>
    <aside class="notes">
        {{ slide.notes | default('Moving to next section.') }}
    </aside>
</section>
